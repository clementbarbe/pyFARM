[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfarm-emg-fmri"
version = "0.2.0"
description = "FARM-inspired EMG-fMRI gradient artifact reduction pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "mne>=1.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
brainvision-export = ["pybv>=0.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["farm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["farm/tests"]
